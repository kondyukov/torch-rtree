[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchrtree"
dynamic = ["version"]
description = "Static packed R-tree for 2D, 3D and 3D+time boxes in pure PyTorch, on CPU or GPU"
authors = [{ name = "Grigoriy Kondyukov" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
bench = ["numpy>=1.24", "rtree>=1.0"]
dev = ["pytest>=7", "ruff>=0.5", "numpy>=1.24", "rtree>=1.0"]

[tool.setuptools.packages.find]
include = ["torchrtree*"]

[tool.setuptools.package-data]
torchrtree = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "torchrtree.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
